name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: image-search
          python-version: 3.10

      - name: Install pre-commit
        run: conda run -n image-search pre-commit install

      - name: Run pre-commit (format, lint, typecheck)
        run: conda run -n image-search pre-commit run --all-files

      - name: Run pytest
        run: conda run -n image-search pytest --maxfail=2 --disable-warnings
